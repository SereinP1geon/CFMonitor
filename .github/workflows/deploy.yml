name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      # 前提：MetricsBroadcaster 类必须从 index.js 导出（已通过 src/index.js 实现）。
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: '7648d191cfe703778022f8aca14ed673'
          wranglerVersion: '4'
          command: deploy

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
